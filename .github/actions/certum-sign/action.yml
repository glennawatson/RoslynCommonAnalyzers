name: Certum SimplySign NuGet signing (prebuilt image)
description: |
  Author-sign .nupkg files with a Certum "Code Signing in the Cloud" certificate.

  Certum SimplySign has no headless signing API: the cloud key is reachable only
  through the SimplySign Desktop GUI, which exposes it as a PKCS#11 token. This
  action runs that GUI headlessly (Xvfb + xdotool), logs in with the TOTP derived
  from the otpauth URI, then signs each package with jsign over PKCS#11 and
  verifies the result with `dotnet nuget verify`.

  MUST run inside the prebuilt certum-signer image (ghcr.io/reactiveui/certum-signer),
  which bakes in SimplySign Desktop, jsign, the .NET 10 and 11 SDKs, and the
  X11/PKCS#11 dependencies and exports $SS_DIST / $JSIGN_JAR. Credentials are read
  from the environment — composite actions cannot declare secret-typed inputs — so
  map these secrets into env on the calling job (standard secrets.* syntax):
    CERTUM_USER_ID            SimplySign login id
    CERTUM_OTP_URI            otpauth:// URI for the SimplySign TOTP
    CERTUM_CERT_FINGERPRINT   (optional) SHA-256 fingerprint to assert against

inputs:
  packages-glob:
    description: 'Glob of .nupkg files to sign (relative to the working directory).'
    required: false
    default: 'signed/*.nupkg'
  timestamp-url:
    description: 'RFC3161 timestamp authority URL.'
    required: false
    default: 'http://time.certum.pl'
  launch-seconds:
    description: 'Seconds to wait after launching SimplySign before driving the UI.'
    required: false
    default: '20'

runs:
  using: composite
  steps:
    - name: Resolve prebuilt SimplySign paths
      shell: bash
      run: |
        cd "$RUNNER_TEMP" && dotnet run - <<'CS'
        using static System.Environment;

        if (GetEnvironmentVariable("SS_DIST") is not { Length: > 0 } dist)
        {
            Console.WriteLine("::error::The prebuilt certum-signer image must set SS_DIST.");
            return 1;
        }

        File.AppendAllLines(
            GetEnvironmentVariable("GITHUB_ENV")!,
            [$"SS_START={Find(dist, "SimplySignDesktop_start")}", $"SS_EXE={Find(dist, "SimplySignDesktop")}", $"SS_PKCS11={Find(dist, "SimplySignPKCS*.so")}"]);

        return 0;

        static string Find(string folder, string pattern) => Directory.EnumerateFiles(folder, pattern, SearchOption.AllDirectories).FirstOrDefault() ?? string.Empty;
        CS

    - name: Start headless display
      shell: bash
      run: |
        cd "$RUNNER_TEMP" && dotnet run - <<'CS'
        using System.Diagnostics;
        using static System.Environment;

        var temp = GetEnvironmentVariable("RUNNER_TEMP")!;
        var home = GetFolderPath(SpecialFolder.UserProfile);

        StartInBackground(new ProcessStartInfo("Xvfb", [":99", "-screen", "0", "1280x1024x24"]), Path.Combine(temp, "xvfb.log"));
        Thread.Sleep(TimeSpan.FromSeconds(3));

        // Without a rootCommand fluxbox runs fbsetbg, whose missing-wallpaper xmessage steals focus from the login form.
        Directory.CreateDirectory(Path.Combine(home, ".fluxbox"));
        File.WriteAllText(Path.Combine(home, ".fluxbox", "init"), "session.screen0.rootCommand: /bin/true\n");

        var fluxbox = new ProcessStartInfo("fluxbox");
        fluxbox.Environment["DISPLAY"] = ":99";
        StartInBackground(fluxbox, Path.Combine(temp, "fluxbox.log"));
        Thread.Sleep(TimeSpan.FromSeconds(2));

        using var discard = File.OpenNullHandle();
        var probe = new ProcessStartInfo("xdpyinfo") { StandardOutputHandle = discard };
        probe.Environment["DISPLAY"] = ":99";
        if (Process.Run(probe) is { ExitCode: not 0 })
        {
            Console.WriteLine("::error::X display :99 did not start.");
            return 1;
        }

        Console.WriteLine("X display :99 up");
        return 0;

        // The X server and window manager outlive this step, writing to their own logs.
        static void StartInBackground(ProcessStartInfo startInfo, string log)
        {
            using var output = File.OpenHandle(log, FileMode.Create, FileAccess.Write, FileShare.ReadWrite);
            startInfo.StartDetached = true;
            startInfo.StandardOutputHandle = output;
            startInfo.StandardErrorHandle = output;
            Process.StartAndForget(startInfo);
        }
        CS

    - name: Connect SimplySign (headless login)
      shell: bash
      env:
        DISPLAY: ':99'
        LAUNCH_SECONDS: ${{ inputs.launch-seconds }}
      run: |
        cd "$RUNNER_TEMP" && dotnet run - -- "$LAUNCH_SECONDS" <<'CS'
        using System.Buffers.Binary;
        using System.Diagnostics;
        using System.Globalization;
        using System.Security.Cryptography;
        using System.Web;
        using static System.Environment;

        if (args is not [var launchSeconds])
        {
            Console.WriteLine("::error::Expected the launch delay argument.");
            return 2;
        }

        if ((GetEnvironmentVariable("CERTUM_USER_ID"), GetEnvironmentVariable("CERTUM_OTP_URI")) is not ({ Length: > 0 } userId, { Length: > 0 } otpUri))
        {
            Console.WriteLine("::error::Map the CERTUM_USER_ID and CERTUM_OTP_URI secrets into the job env.");
            return 1;
        }

        string dist = GetEnvironmentVariable("SS_DIST")!, temp = GetEnvironmentVariable("RUNNER_TEMP")!, home = GetFolderPath(SpecialFolder.UserProfile);

        // Without its config in $HOME and the logon-dialog preference, SimplySign shows a "Critical error" on launch.
        if (Path.Combine(dist, "SimplySignDesktop.xml") is var config && File.Exists(config))
        {
            File.Copy(config, Path.Combine(home, "SimplySignDesktop.xml"), overwrite: true);
        }

        Directory.CreateDirectory(Path.Combine(home, ".config"));
        File.WriteAllLines(
            Path.Combine(home, ".config", "Unknown Organization.conf"),
            ["[General]", "CacheUserIdAtLogon=Yes", "ShowLogonDialogAfterApplicationStartup=Yes", "ShowLogonDialogWhenAnyAppRequestsAccess=Yes"]);

        var log = Path.Combine(temp, "simplysign.log");
        using (var output = File.OpenHandle(log, FileMode.Create, FileAccess.Write, FileShare.ReadWrite))
        {
            // Launch via the *_start wrapper (sets LD_LIBRARY_PATH for the bundled Qt).
            var launch = new ProcessStartInfo(GetEnvironmentVariable("SS_START") is { Length: > 0 } start ? start : GetEnvironmentVariable("SS_EXE")!)
            {
                StartDetached = true,
                StandardOutputHandle = output,
                StandardErrorHandle = output,
            };

            // SimplySignDesktop segfaults before drawing the login window when $USER is unset, as it is in containers.
            launch.Environment["USER"] = GetEnvironmentVariable("USER") is { Length: > 0 } user ? user : "root";
            launch.Environment["LD_LIBRARY_PATH"] = $"{dist}:{GetEnvironmentVariable("LD_LIBRARY_PATH")}";
            Process.StartAndForget(launch);
        }

        Thread.Sleep(TimeSpan.FromSeconds(int.Parse(launchSeconds, CultureInfo.InvariantCulture)));

        var otp = Totp(otpUri);
        Console.WriteLine($"::add-mask::{otp}");

        Window? login = null;
        for (var attempt = 1; attempt <= 30; attempt++)
        {
            if (LargestWindow() is { Width: >= 400, Height: >= 300 } found)
            {
                login = found;
                Console.WriteLine($"login window {found.Id} {found.Width}x{found.Height} (attempt {attempt})");
                break;
            }

            Thread.Sleep(TimeSpan.FromSeconds(2));
        }

        if (login is not { } window)
        {
            Console.WriteLine("::error::SimplySign login window did not appear");
            Console.WriteLine(File.ReadAllText(log));
            return 1;
        }

        Activate(window);
        XDoTool("windowraise", window.Id);
        Thread.Sleep(TimeSpan.FromSeconds(1));

        // Click E-MAIL field, type id; Tab; type OTP; click Login.
        Click(window, 39);
        Thread.Sleep(TimeSpan.FromSeconds(1));
        XDoTool("type", "--clearmodifiers", "--delay", "50", userId);
        XDoTool("key", "Tab");
        Thread.Sleep(TimeSpan.FromSeconds(1));
        XDoTool("type", "--clearmodifiers", "--delay", "50", otp);
        Click(window, 76);
        Thread.Sleep(TimeSpan.FromSeconds(8));

        // The token only activates once the "Logon successful" dialog's Close button (bottom-centre) is clicked.
        var dialog = LargestWindow() ?? window;
        Activate(dialog);
        Click(dialog, 94);
        Thread.Sleep(TimeSpan.FromSeconds(3));

        // The slot only enumerates once the cloud session is up, so this fails fast on a bad login.
        // It cannot show the certificate: this token lists none to pkcs11-tool even when signing works.
        return Process.Run("pkcs11-tool", ["--module", GetEnvironmentVariable("SS_PKCS11")!, "-L"], timeout: TimeSpan.FromSeconds(60)) switch
        {
            { Canceled: true } => 124,
            var slots => slots.ExitCode,
        };

        // Match on getwindowname (_NET_WM_NAME): `search --name PATTERN` only sees this app's empty WM_NAME.
        static Window? LargestWindow()
        {
            Window? largest = null;
            foreach (var id in Capture("search", "--name", string.Empty).Lines)
            {
                if (!Capture("getwindowname", id).StandardOutput.Contains("implySign", StringComparison.Ordinal))
                {
                    continue;
                }

                Dictionary<string, int> geometry = [with(StringComparer.Ordinal)];
                foreach (var line in Capture("getwindowgeometry", "--shell", id).Lines)
                {
                    if (line.Split('=', 2) is [var name, var value] && int.TryParse(value, CultureInfo.InvariantCulture, out var number))
                    {
                        geometry[name] = number;
                    }
                }

                var candidate = new Window(id, geometry.GetValueOrDefault("X"), geometry.GetValueOrDefault("Y"), geometry.GetValueOrDefault("WIDTH"), geometry.GetValueOrDefault("HEIGHT"));
                if (candidate.Area > (largest?.Area ?? 0))
                {
                    largest = candidate;
                }
            }

            return largest;
        }

        static void Activate(Window window)
        {
            if (XDoTool("windowactivate", "--sync", window.Id) is not 0)
            {
                XDoTool("windowactivate", window.Id);
            }
        }

        static void Click(Window window, int percentDown) =>
            XDoTool("mousemove", $"{window.X + (window.Width / 2)}", $"{window.Y + (window.Height * percentDown / 100)}", "click", "1");

        static int XDoTool(params IEnumerable<string> arguments) => Process.Run("xdotool", arguments).ExitCode;

        static ProcessTextOutput Capture(params IEnumerable<string> arguments) => Process.RunAndCaptureText("xdotool", arguments);

        // RFC 6238 TOTP from the otpauth URI, honouring its algorithm, digits and period.
        static string Totp(string uri)
        {
            var query = HttpUtility.ParseQueryString(new Uri(uri).Query);
            var key = Base32(query["secret"]!);
            var digits = int.Parse(query["digits"] ?? "6", CultureInfo.InvariantCulture);
            var period = long.Parse(query["period"] ?? "30", CultureInfo.InvariantCulture);

            var counter = new byte[8];
            BinaryPrimitives.WriteInt64BigEndian(counter, DateTimeOffset.UtcNow.ToUnixTimeSeconds() / period);

            var hash = (query["algorithm"] ?? "SHA1").ToUpperInvariant() switch
            {
                "SHA1" => HMACSHA1.HashData(key, counter),
                "SHA256" => HMACSHA256.HashData(key, counter),
                "SHA512" => HMACSHA512.HashData(key, counter),
                var algorithm => throw new NotSupportedException($"Unsupported TOTP algorithm {algorithm}."),
            };

            var offset = hash[^1] & 0xF;
            var code = (BinaryPrimitives.ReadInt32BigEndian(hash.AsSpan(offset)) & 0x7FFFFFFF) % (int)Math.Pow(10, digits);
            return code.ToString(CultureInfo.InvariantCulture).PadLeft(digits, '0');
        }

        static byte[] Base32(string text)
        {
            const string alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
            List<byte> bytes = [with(capacity: text.Length * 5 / 8)];
            int buffer = 0, bits = 0;
            foreach (var character in text.TrimEnd('=').ToUpperInvariant())
            {
                buffer = ((buffer << 5) | alphabet.IndexOf(character)) & 0xFFFF;
                bits += 5;
                if (bits >= 8)
                {
                    bits -= 8;
                    bytes.Add((byte)(buffer >> bits));
                }
            }

            return [.. bytes];
        }

        internal readonly record struct Window(string Id, int X, int Y, int Width, int Height)
        {
            public int Area => Width * Height;
        }

        internal static class ProcessOutputExtensions
        {
            extension(ProcessTextOutput output)
            {
                public string[] Lines => output.StandardOutput.Split('\n', StringSplitOptions.RemoveEmptyEntries | StringSplitOptions.TrimEntries);
            }
        }
        CS

    - name: Sign packages with jsign + verify
      shell: bash
      env:
        TS_URL: ${{ inputs.timestamp-url }}
        PKG_GLOB: ${{ inputs.packages-glob }}
      run: |
        cd "$RUNNER_TEMP" && dotnet run - -- "$TS_URL" "$PKG_GLOB" <<'CS'
        using System.Diagnostics;
        using static System.Environment;

        if (args is not [var timestampUrl, var packagesGlob])
        {
            Console.WriteLine("::error::Expected the timestamp URL and packages glob arguments.");
            return 2;
        }

        if (GetEnvironmentVariable("JSIGN_JAR") is not { Length: > 0 } jar)
        {
            Console.WriteLine("::error::The prebuilt certum-signer image must set JSIGN_JAR.");
            return 1;
        }

        var keystore = Path.Combine(GetEnvironmentVariable("RUNNER_TEMP")!, "sunpkcs11.conf");
        File.WriteAllLines(keystore, ["name = SimplySign", $"library = {GetEnvironmentVariable("SS_PKCS11")}", "slotListIndex = 0"]);

        Directory.SetCurrentDirectory(GetEnvironmentVariable("GITHUB_WORKSPACE")!);

        var folder = Path.GetDirectoryName(packagesGlob) is { Length: > 0 } directory ? directory : ".";
        string[] packages = Directory.Exists(folder) ? [.. Directory.GetFiles(folder, Path.GetFileName(packagesGlob)).Order(StringComparer.Ordinal)] : [];
        if (packages is [])
        {
            Console.WriteLine($"::error::no packages matched: {packagesGlob}");
            return 1;
        }

        foreach (var package in packages)
        {
            Console.WriteLine($"::group::sign {package}");

            // The keystore can report no certificate for a few seconds after login, so only that error is retried.
            // jsign auto-selects the token's single key; the RFC3161 timestamp outlives the certificate.
            for (var attempt = 1; ; attempt++)
            {
                var result = Process.RunAndCaptureText(
                    "java",
                    ["-jar", jar, "--storetype", "PKCS11", "--keystore", keystore, "--storepass", string.Empty, "--alg", "SHA-256", "--tsmode", "RFC3161", "--tsaurl", timestampUrl, "--replace", package]);

                var output = result.StandardOutput + result.StandardError;
                Console.WriteLine(output);

                if (result is { ExitStatus.ExitCode: 0 })
                {
                    break;
                }

                if (!output.Contains("No certificate found", StringComparison.Ordinal))
                {
                    return result.ExitStatus.ExitCode;
                }

                if (attempt is 15)
                {
                    Console.WriteLine("::error::keystore exposed no certificate to jsign");
                    return 1;
                }

                Console.WriteLine($"keystore not populated yet (attempt {attempt})");
                Thread.Sleep(TimeSpan.FromSeconds(4));
            }

            if (Process.Run("dotnet", ["nuget", "verify", package, "--all", "--verbosity", "detailed"]) is { ExitCode: not 0 } verify)
            {
                return verify.ExitCode;
            }

            Console.WriteLine("::endgroup::");
        }

        return 0;
        CS
