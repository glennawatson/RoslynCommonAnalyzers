name: .NET Environment Setup
description: Set up the shared .NET environment with this repository's SDK and version defaults.

inputs:
  dotnet-versions:
    description: 'SDKs for the test targets. Action scripts use .NET 11.'
    default: |
      10.0.x
      11.0.x
  stamp-version:
    description: 'Stamp the version with MinVer.'
    default: 'true'
  minver-tag-prefix:
    description: 'Release tags are bare versions.'
    default: ''
  minver-minimum-major-minor:
    description: 'MinVer floor when no tag is reachable.'
    default: '1.0'
  minver-default-pre-release-identifiers:
    description: 'Pre-release identifiers for height-only builds.'
    default: 'alpha.0'
  minver-auto-increment:
    description: 'Version segment to increment.'
    default: 'patch'
  minver-version-override:
    description: 'Exact version to stamp.'
    default: ''

outputs:
  version-semver2:
    description: 'MinVer SemVer2 version.'
    value: ${{ steps.environment.outputs.version-semver2 }}

runs:
  using: composite
  steps:
    - name: Setup shared .NET environment
      id: environment
      uses: glennawatson/actions-common/.github/actions/dotnet-environment@ccd848765a7faee125e5e09b60acb86f34f9adc5 # main
      with:
        dotnet-versions: ${{ inputs.dotnet-versions }}
        src-folder: src
        solution-file: RoslynCommonAnalyzers.slnx
        stamp-version: ${{ inputs.stamp-version }}
        minver-tag-prefix: ${{ inputs.minver-tag-prefix }}
        minver-minimum-major-minor: ${{ inputs.minver-minimum-major-minor }}
        minver-default-pre-release-identifiers: ${{ inputs.minver-default-pre-release-identifiers }}
        minver-auto-increment: ${{ inputs.minver-auto-increment }}
        minver-version-override: ${{ inputs.minver-version-override }}
