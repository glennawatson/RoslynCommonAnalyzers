name: Benchmarks A/B

on:
  workflow_dispatch:
    inputs:
      baseline:
        description: 'Baseline commit.'
        type: string
        required: true
      candidate:
        description: 'Commit compared against the baseline. Empty uses the latest commit on this branch.'
        type: string
        default: ''
      suite:
        description: 'Which benchmark suite to run'
        type: choice
        default: all
        options:
          - stylesharp
          - performancesharp
          - securitysharp
          - all
      filter:
        description: 'BenchmarkDotNet filter globs, separated by spaces.'
        type: string
        default: '*'
      benchmarksPerSlice:
        description: 'Benchmarks per runner. 25 keeps a slice near 2.5 hours.'
        type: number
        default: 25
      warmupCount:
        description: 'Warmup iterations per benchmark.'
        type: number
        default: 6
      iterationCount:
        description: 'Measured iterations per benchmark.'
        type: number
        default: 15

permissions:
  contents: read

concurrency:
  group: benchmarks-ab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan slices
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: 1
      DOTNET_CLI_USE_MSBUILD_SERVER: 0

    outputs:
      slices: ${{ steps.plan.outputs.slices }}
      sliceSummary: ${{ steps.plan.outputs.sliceSummary }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Set up before either compared commit is on disk.
      - name: Setup .NET Environment
        uses: ./.github/actions/dotnet-environment
        with:
          stamp-version: 'false'

      - name: Checkout base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.baseline }}
          path: ab/base

      - name: Checkout head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.candidate || github.sha }}
          path: ab/head

      - name: Split the matching benchmarks into slices
        id: plan
        shell: bash
        env:
          SUITE: ${{ inputs.suite }}
          FILTER: ${{ inputs.filter }}
          BENCHMARKS_PER_SLICE: ${{ inputs.benchmarksPerSlice }}
        working-directory: ${{ runner.temp }}
        run: dotnet run --file "$GITHUB_WORKSPACE/.github/scripts/benchmark-plan.cs" -- "$SUITE" "$FILTER" "$BENCHMARKS_PER_SLICE"

  benchmark:
    name: benchmark (${{ matrix.slice }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 360

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.slices) }}

    env:
      DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: 1

      # A lingering build server competes with the measurement.
      DOTNET_CLI_USE_MSBUILD_SERVER: 0

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Stamps one version for both builds, so the assemblies differ only in their code.
      - name: Setup .NET Environment
        uses: ./.github/actions/dotnet-environment

      - name: Checkout base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.baseline }}
          path: ab/base

      - name: Checkout head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.candidate || github.sha }}
          path: ab/head

      # A-B-B-A: drift across the job lands on each side once.
      - name: Run base and head in both orders
        shell: bash
        env:
          PROJECT: ${{ matrix.project }}
          SLICE: ${{ matrix.slice }}
          BENCHMARKS: ${{ matrix.benchmarks }}
          WARMUP_COUNT: ${{ inputs.warmupCount }}
          ITERATION_COUNT: ${{ inputs.iterationCount }}
        working-directory: ${{ runner.temp }}
        run: dotnet run --file "$GITHUB_WORKSPACE/.github/scripts/benchmark-ab-run.cs" -- "$PROJECT" "$SLICE" "$RUNNER_TEMP/benchmark-ab" "$WARMUP_COUNT" "$ITERATION_COUNT"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: benchmark-ab-${{ matrix.slice }}
          path: |
            ${{ runner.temp }}/benchmark-ab/**/*-report-full.json
            ${{ runner.temp }}/benchmark-ab/**/*-report-github.md
          if-no-files-found: ignore

  compare:
    name: Compare base and head
    needs: [ plan, benchmark ]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET Environment
        uses: ./.github/actions/dotnet-environment
        with:
          stamp-version: 'false'

      - name: Download slice results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: benchmark-ab-*
          path: ${{ runner.temp }}/benchmark-ab
          merge-multiple: true

      - name: Write the report
        shell: bash
        env:
          BASELINE: ${{ inputs.baseline }}
          CANDIDATE: ${{ inputs.candidate || github.sha }}
          SUITE: ${{ inputs.suite }}
          FILTER: ${{ inputs.filter }}
          SLICES: ${{ needs.plan.outputs.sliceSummary }}
        working-directory: ${{ runner.temp }}
        run: dotnet run --file "$GITHUB_WORKSPACE/.github/scripts/benchmark-ab-report.cs" -- "$RUNNER_TEMP/benchmark-ab" "$RUNNER_TEMP/benchmark-ab-report.md" "$BASELINE" "$CANDIDATE" "$SUITE" "$FILTER"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: benchmark-ab-report
          path: ${{ runner.temp }}/benchmark-ab-report.md
          if-no-files-found: ignore
