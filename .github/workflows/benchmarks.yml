name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Which benchmark suite to run'
        type: choice
        default: all
        options:
          - stylesharp
          - performancesharp
          - securitysharp
          - all
      filter:
        description: 'BenchmarkDotNet filter, e.g. *RedundantCast* or *'
        type: string
        default: '*'
      revision:
        description: 'Commit to check out and measure. Empty measures the commit that triggered the run.'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: 1

      # Every build-server connect attempt waits out a timeout, and a lingering server competes with the measurement.
      DOTNET_CLI_USE_MSBUILD_SERVER: 0

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Set up from the trusted checkout before the measured commit is on disk.
      - name: Setup .NET Environment
        uses: ./.github/actions/dotnet-environment

      - name: Checkout measured commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.revision }}
          path: bench

      - name: Run benchmarks
        shell: bash
        env:
          SUITE: ${{ inputs.suite }}
          FILTER: ${{ inputs.filter }}
        run: |
          cd "$RUNNER_TEMP" && dotnet run - -- "$SUITE" "$FILTER" <<'CS'
          using System.Diagnostics;
          using static System.Environment;

          if (args is not [var suite, var filter])
          {
              Console.WriteLine("::error::Expected the suite and filter arguments.");
              return 2;
          }

          string[] projects = suite switch
          {
              "stylesharp" => ["benchmarks/StyleSharp.Analyzers.Benchmarks"],
              "performancesharp" => ["benchmarks/PerformanceSharp.Analyzers.Benchmarks"],
              "securitysharp" => ["benchmarks/SecuritySharp.Analyzers.Benchmarks"],
              "all" => ["benchmarks/StyleSharp.Analyzers.Benchmarks", "benchmarks/PerformanceSharp.Analyzers.Benchmarks", "benchmarks/SecuritySharp.Analyzers.Benchmarks"],
              _ => [],
          };

          if (projects is [])
          {
              Console.WriteLine($"::error::Unknown benchmark suite '{suite}'.");
              return 2;
          }

          var workspace = GetEnvironmentVariable("GITHUB_WORKSPACE")!;

          RaisePriority();
          Directory.SetCurrentDirectory(Path.Combine(workspace, "bench", "src"));

          foreach (var project in projects)
          {
              var name = Path.GetFileName(project);
              Console.WriteLine($"::group::{name}");

              var status = Process.Run(
                  "dotnet",
                  [
                      "run", "--project", project, "-c", "Release", "--",
                      "--filter", filter, "--artifacts", Path.Combine(workspace, "benchmark-artifacts", name),
                      "--exporters", "github", "json", "html", "csv",
                  ]);

              Console.WriteLine("::endgroup::");
              if (status is { ExitCode: not 0 })
              {
                  Console.WriteLine($"::error::{name} exited with {status.ExitCode}");
                  return status.ExitCode;
              }
          }

          return 0;

          // The runner is a shared virtual machine: the raised priority removes the noise that is ours to remove, and the
          // figures remain trend and regression evidence rather than absolutes. Processes started from here inherit it.
          static void RaisePriority()
          {
              if (Process.Run("sudo", ["-n", "renice", "-n", "-20", "-p", $"{ProcessId}"], silent: true) is { ExitCode: 0 })
              {
                  return;
              }

              Console.WriteLine("::warning::Could not raise the benchmark priority.");
          }
          CS

      - name: Validate benchmark reports
        shell: bash
        run: |
          cd "$RUNNER_TEMP" && dotnet run - <<'CS'
          using static System.Environment;

          var root = Path.Combine(GetEnvironmentVariable("GITHUB_WORKSPACE")!, "benchmark-artifacts");

          // BenchmarkDotNet exits zero on a validation error, so the exported reports are the evidence it ran.
          string[] reports = Directory.Exists(root) ? Directory.GetFiles(root, "*-report-github.md", SearchOption.AllDirectories) : [];
          if (reports is [])
          {
              Console.WriteLine("::error::No benchmark reports were produced. Check the validation errors above.");
              return 1;
          }

          // A job whose build fails still exports its rows, with every measurement as NA.
          var unmeasured = reports
              .Select(report => (Name: Path.GetFileName(report).Replace("-report-github.md", string.Empty), Rows: File.ReadLines(report).Count(line => line.StartsWith('|') && line.Split('|').Any(cell => cell.Trim() == "NA"))))
              .Where(report => report.Rows > 0)
              .Select(report => $"{report.Name} ({report.Rows} rows)")
              .ToArray();

          if (unmeasured is not [])
          {
              Console.WriteLine($"::error::These benchmarks measured nothing: {string.Join("; ", unmeasured)}");
              return 1;
          }

          return 0;
          CS

      - name: Publish results to run summary
        if: always()
        shell: bash
        env:
          SUITE: ${{ inputs.suite }}
          FILTER: ${{ inputs.filter }}
        run: |
          cd "$RUNNER_TEMP" && dotnet run - -- "$SUITE" "$FILTER" <<'CS'
          using System.Diagnostics;
          using static System.Environment;

          if (args is not [var suite, var filter])
          {
              Console.WriteLine("::error::Expected the suite and filter arguments.");
              return;
          }

          // A step summary is dropped whole once it passes 1 MiB, so the tables stop before that and the artifact carries the rest.
          const long Budget = 900 * 1024;

          var summary = GetEnvironmentVariable("GITHUB_STEP_SUMMARY")!;
          var root = Path.Combine(GetEnvironmentVariable("GITHUB_WORKSPACE")!, "benchmark-artifacts");

          // With a revision input the triggering commit is not the measured one, so the commit is read from the measured tree.
          var commit = Process.RunAndCaptureText("git", ["-C", Path.Combine(GetEnvironmentVariable("GITHUB_WORKSPACE")!, "bench"), "rev-parse", "HEAD"]).StandardOutput.Trim();

          File.AppendAllLines(
              summary,
              [
                  "# Benchmark results",
                  "",
                  $"Suite `{suite}`, filter `{filter}`, commit `{commit}`.",
                  "",
                  "The runner is shared, so read these for trend and regression rather than as absolute figures.",
                  "Full JSON, HTML and CSV exports are attached to this run as `benchmark-reports`.",
                  "",
              ]);

          string[] reports = Directory.Exists(root) ? [.. Directory.GetFiles(root, "*-report-github.md", SearchOption.AllDirectories).Order(StringComparer.Ordinal)] : [];
          if (reports is [])
          {
              File.AppendAllLines(summary, ["No benchmark reports were exported."]);
              return;
          }

          List<string> skipped = [];
          foreach (var report in reports)
          {
              var title = Path.GetFileName(report).Replace("-report-github.md", string.Empty);
              if (new FileInfo(summary).Length + new FileInfo(report).Length > Budget)
              {
                  skipped.Add(title);
                  continue;
              }

              File.AppendAllLines(summary, [$"<details><summary>{title}</summary>", "", .. File.ReadLines(report), "", "</details>", ""]);
          }

          if (skipped is not [])
          {
              File.AppendAllLines(summary, ["", $"Omitted here to stay inside the summary limit: {string.Join(", ", skipped)}. Read them in the benchmark-reports artifact.", ""]);
          }
          CS

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-reports
          path: benchmark-artifacts/**
          if-no-files-found: error
          retention-days: 30
