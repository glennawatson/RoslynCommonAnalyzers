name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Which benchmark suite to run'
        type: choice
        default: all
        options:
          - stylesharp
          - performancesharp
          - securitysharp
          - all
      filter:
        description: 'BenchmarkDotNet filter, e.g. *RedundantCast* or *'
        type: string
        default: '*'
      revision:
        description: 'Commit to check out and measure. Empty measures the commit that triggered the run.'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: 1

      # Every build-server connect attempt waits out a timeout, and a lingering server competes with the measurement.
      DOTNET_CLI_USE_MSBUILD_SERVER: 0

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Set up from the trusted checkout before the measured commit is on disk.
      - name: Setup .NET Environment
        uses: ./.github/actions/dotnet-environment

      - name: Checkout measured commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.revision }}
          path: bench

      - name: Select benchmark framework
        id: framework
        shell: bash
        env:
          SUITE: ${{ inputs.suite }}
        working-directory: ${{ runner.temp }}
        run: dotnet run --file "$GITHUB_WORKSPACE/.github/scripts/benchmark-framework.cs" -- "$SUITE" "$GITHUB_WORKSPACE/bench/src"

      - name: Run benchmarks
        uses: glennawatson/actions-common/.github/actions/benchmark-run@7f2014219353aee799dfeef2a9b97acaeabca0b8 # main
        with:
          projects: ${{ steps.framework.outputs.projects }}
          src-folder: bench/src
          host-framework: ${{ steps.framework.outputs.framework }}
          filter: ${{ inputs.filter }}

      - name: Validate benchmark reports
        uses: glennawatson/actions-common/.github/actions/benchmark-validate@7f2014219353aee799dfeef2a9b97acaeabca0b8 # main

      - name: Publish results to run summary
        if: always()
        uses: glennawatson/actions-common/.github/actions/benchmark-summary@7f2014219353aee799dfeef2a9b97acaeabca0b8 # main
        with:
          filter: ${{ inputs.filter }}

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: benchmark-reports
          path: benchmark-artifacts/**
          if-no-files-found: error
          retention-days: 30
