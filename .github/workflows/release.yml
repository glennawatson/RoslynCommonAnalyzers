name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Release level for the new tag. Pick one, unless versionOverride is set.'
        required: true
        type: choice
        options:
          - '(pick one)'
          - major
          - minor
          - patch

      preRelease:
        description: 'Pre-release channel (e.g. beta, rc). The version becomes <bumped-core>-<channel>.<N>. Empty = stable release.'
        required: false
        type: string
        default: ''

      versionOverride:
        description: 'Exact version to release (e.g. 4.2.5), bypassing the bump from the latest tag. Leave bump at "(pick one)".'
        required: false
        type: string
        default: ''

      sourceRef:
        description: 'Git ref (tag, branch or SHA) to release from. Empty = the ref this run was started on.'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      semver2: ${{ steps.minver.outputs.SemVer2 }}
      tag: ${{ steps.tagname.outputs.tag }}
      prerelease: ${{ steps.tagname.outputs.prerelease }}
      sourceSha: ${{ steps.sourcesha.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sourceRef }}
          fetch-depth: 0

      # The source ref may predate these actions, so they are taken from the commit this workflow runs on.
      - name: Checkout release actions
        uses: actions/checkout@v7
        with:
          path: .release-actions
          sparse-checkout: .github/actions

      - name: Use the release actions
        shell: bash
        run: |
          rm -rf .github/actions
          mkdir -p .github
          cp -r .release-actions/.github/actions .github/actions

      - name: Setup .NET Environment
        uses: ./.github/actions/dotnet-environment
        with:
          stamp-version: 'false'

      - name: Resolve built commit SHA
        id: sourcesha
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate version inputs
        shell: bash
        env:
          BUMP: ${{ inputs.bump }}
          PRE_RELEASE: ${{ inputs.preRelease }}
          VERSION_OVERRIDE: ${{ inputs.versionOverride }}
        run: |
          cd "$RUNNER_TEMP" && dotnet run - -- "$BUMP" "$PRE_RELEASE" "$VERSION_OVERRIDE" <<'CS'
          if (args is not [var choice, var preRelease, var versionOverride])
          {
              Console.WriteLine("::error::Expected the bump, pre-release and version override arguments.");
              return 2;
          }

          var bump = choice is "(pick one)" ? string.Empty : choice;
          string? error = (bump, preRelease, versionOverride) switch
          {
              ("", _, "") => "Pick a bump level (major, minor or patch), or give a version override.",
              (not "", _, not "") => "'bump' and 'versionOverride' are mutually exclusive: set exactly one.",
              (_, not "", not "") => "'preRelease' cannot be combined with 'versionOverride': put any pre-release suffix in the override itself.",
              _ => null,
          };

          if (error is not null)
          {
              Console.WriteLine($"::error::{error}");
              return 1;
          }

          return 0;
          CS

      # The create-release job creates the tag, so a failed build or sign leaves no orphan tag.
      - name: Compute version and tag
        if: inputs.bump != '(pick one)' && inputs.versionOverride == ''
        id: bump
        uses: ./.github/actions/compute-version-and-tag
        with:
          bump: ${{ inputs.bump }}
          tag-prefix: ''
          pre-release-id: ${{ inputs.preRelease }}
          push-tag: 'false'

      # compute-version-and-tag rejects an existing bump tag; an existing override tag is rejected here.
      - name: Resolve release tag
        id: tagname
        shell: bash
        env:
          BUMP_TAG: ${{ steps.bump.outputs.tag }}
          BUMP_PRERELEASE: ${{ steps.bump.outputs.prerelease }}
          VERSION_OVERRIDE: ${{ inputs.versionOverride }}
        run: |
          cd "$RUNNER_TEMP" && dotnet run - -- "$BUMP_TAG" "$BUMP_PRERELEASE" "$VERSION_OVERRIDE" <<'CS'
          using System.Diagnostics;
          using static System.Environment;

          if (args is not [var bumpTag, var bumpPrerelease, var versionOverride])
          {
              Console.WriteLine("::error::Expected the bump tag, bump pre-release and version override arguments.");
              return 2;
          }

          var outputs = GetEnvironmentVariable("GITHUB_OUTPUT")!;
          if (versionOverride is "")
          {
              File.AppendAllLines(outputs, [$"tag={bumpTag}", $"prerelease={(bumpPrerelease is "" ? "false" : bumpPrerelease)}"]);
              return 0;
          }

          Directory.SetCurrentDirectory(GetEnvironmentVariable("GITHUB_WORKSPACE")!);
          if (Process.Run("git", ["rev-parse", "-q", "--verify", $"refs/tags/{versionOverride}"], silent: true) is { ExitCode: 0 })
          {
              Console.WriteLine($"::error::Tag {versionOverride} already exists. Refusing to re-release an existing version.");
              return 1;
          }

          File.AppendAllLines(outputs, [$"tag={versionOverride}", $"prerelease={(versionOverride.Contains('-') ? "true" : "false")}"]);
          return 0;
          CS

      - name: Stamp version with MinVer
        id: minver
        uses: ./.github/actions/minver
        with:
          version-override: ${{ inputs.versionOverride != '' && inputs.versionOverride || steps.bump.outputs.version }}

      - name: Build
        uses: ./.github/actions/dotnet-build
        with:
          solution-file: RoslynCommonAnalyzers.slnx

      - name: Pack NuGet packages
        shell: bash
        working-directory: src
        run: dotnet pack RoslynCommonAnalyzers.slnx --no-build --configuration Release -o "${GITHUB_WORKSPACE}/packages"

      - name: Upload unsigned packages
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-nuget
          path: packages/*.nupkg
          if-no-files-found: error

  sign:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: read
      packages: read
    # SimplySign has no headless API; certum-sign drives its GUI under Xvfb, which needs Linux.
    container:
      image: ghcr.io/reactiveui/certum-signer:latest@sha256:842fff11bc5ea1e9efd13058589c15c17c61f15609ec63531d1c8dbcae24c257
    # Composite actions cannot declare secret inputs, so certum-sign reads these from env.
    env:
      CERTUM_USER_ID: ${{ secrets.CERTUM_USER_ID }}
      CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
      CERTUM_CERT_FINGERPRINT: ${{ secrets.CERTUM_CERT_FINGERPRINT }}
    steps:
      - name: Checkout release actions
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions

      - name: Download unsigned packages
        uses: actions/download-artifact@v8
        with:
          name: unsigned-nuget
          path: signed

      - name: Sign packages with Certum SimplySign
        uses: ./.github/actions/certum-sign
        with:
          packages-glob: 'signed/*.nupkg'

      - name: Upload signed packages
        uses: actions/upload-artifact@v7
        with:
          name: signed-nuget
          path: signed/*.nupkg
          if-no-files-found: error

  publish-nuget:
    needs: [ build, sign ]
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x

      - name: Download signed packages
        uses: actions/download-artifact@v8
        with:
          name: signed-nuget
          path: signed

      - name: NuGet login (OIDC trusted publishing)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          cd "$RUNNER_TEMP" && dotnet run - <<'CS'
          using System.Diagnostics;
          using static System.Environment;

          var packages = Directory.GetFiles(Path.Combine(GetEnvironmentVariable("GITHUB_WORKSPACE")!, "signed"), "*.nupkg");
          if (packages is [])
          {
              Console.WriteLine("::error::No signed packages were downloaded.");
              return 1;
          }

          foreach (var package in packages.Order(StringComparer.Ordinal))
          {
              if (Process.Run("dotnet", ["nuget", "push", package, "--source", "https://api.nuget.org/v3/index.json", "--api-key", GetEnvironmentVariable("NUGET_API_KEY")!]) is { ExitCode: not 0 } push)
              {
                  return push.ExitCode;
              }
          }

          return 0;
          CS

  create-release:
    needs: [ build, publish-nuget ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download signed packages
        uses: actions/download-artifact@v8
        with:
          name: signed-nuget
          path: signed

      - name: Setup .NET Environment
        uses: ./.github/actions/dotnet-environment
        with:
          stamp-version: 'false'

      - name: Install GitReleaseNoteGenerator
        run: dotnet tool install -g GitReleaseNoteGenerator

      - name: Generate release notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.semver2 }}
        run: git-release-notes --release-version "$RELEASE_VERSION" --output-file release-notes.md

      # Also creates the tag, pinned by --target to the commit the build job built.
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          TARGET: ${{ needs.build.outputs.sourceSha }}
          TITLE: ${{ needs.build.outputs.semver2 }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          cd "$RUNNER_TEMP" && dotnet run - -- "$REPO" "$TAG" "$TARGET" "$TITLE" "$PRERELEASE" <<'CS'
          using System.Diagnostics;
          using static System.Environment;

          if (args is not [var repository, var tag, var target, var title, var prerelease])
          {
              Console.WriteLine("::error::Expected the repository, tag, target, title and pre-release arguments.");
              return 2;
          }

          Directory.SetCurrentDirectory(GetEnvironmentVariable("GITHUB_WORKSPACE")!);

          string[] flags = prerelease is "true" ? ["--prerelease"] : [];
          return Process.Run(
              "gh",
              ["release", "create", tag, "--repo", repository, "--target", target, "--title", title, "--notes-file", "release-notes.md", .. flags, .. Directory.GetFiles("signed", "*.nupkg")]).ExitCode;
          CS
