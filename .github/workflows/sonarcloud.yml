name: SonarCloud

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: sonarcloud-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sonarcloud:
    name: Build, test, and analyze
    # Fork PRs get no SONAR_TOKEN, so they are skipped rather than failed.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: 1
      # Composite actions cannot declare secret inputs, so the sonarcloud action reads this from env.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup .NET Environment
        id: environment
        uses: ./.github/actions/dotnet-environment

      - name: SonarCloud begin
        id: sonar-begin
        uses: glennawatson/actions-common/.github/actions/sonarcloud@main
        with:
          mode: begin
          extra-begin-args: >-
            /d:sonar.issue.ignore.multicriteria=nullForgiving,nullChecks,linqLoops
            /d:sonar.issue.ignore.multicriteria.nullForgiving.ruleKey=csharpsquid:S8969
            /d:sonar.issue.ignore.multicriteria.nullForgiving.resourceKey=**/*.cs
            /d:sonar.issue.ignore.multicriteria.nullChecks.ruleKey=csharpsquid:S2589
            /d:sonar.issue.ignore.multicriteria.nullChecks.resourceKey=**/*.cs
            /d:sonar.issue.ignore.multicriteria.linqLoops.ruleKey=csharpsquid:S3267
            /d:sonar.issue.ignore.multicriteria.linqLoops.resourceKey=**/*.cs
          project-key: glennawatson_RoslynCommonAnalyzers
          organization: glennawatson
          version: ${{ steps.environment.outputs.version-semver2 }}
          exclusions: '**/tests/**,**/benchmarks/**'
          coverage-exclusions: '**/tests/**,**/benchmarks/**'
          cpd-exclusions: '**/tests/**,**/benchmarks/**'
          test-exclusions: '**/tests/**,**/benchmarks/**'
          working-directory: src

      - name: Build
        uses: glennawatson/actions-common/.github/actions/dotnet-build@main
        with:
          solution-file: RoslynCommonAnalyzers.slnx

      - name: Test
        uses: glennawatson/actions-common/.github/actions/dotnet-test@main
        with:
          solution-file: RoslynCommonAnalyzers.slnx

      - name: SonarCloud end
        # A failed build or test still uploads partial analysis.
        if: always() && steps.sonar-begin.outcome == 'success'
        uses: glennawatson/actions-common/.github/actions/sonarcloud@main
        with:
          mode: end
          project-key: glennawatson_RoslynCommonAnalyzers
          working-directory: src
